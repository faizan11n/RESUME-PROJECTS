services:
  db:
    image: mysql:8.0
    container_name: notesapp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: notesapp
      MYSQL_USER: demouser
      MYSQL_PASSWORD: demopass123
    volumes:
      - notesapp_data:/var/lib/mysql
    networks:
      - notesapp-net

  webapp:
    build: .
    container_name: notesapp-web
    restart: always
    depends_on:
      - db
    ports:
      - "8089:5000"
    environment:
      DB_HOST: db
      DB_USER: demouser
      DB_PASSWORD: demopass123
      DB_NAME: notesapp
    networks:
      - notesapp-net

networks:
  notesapp-net:
    driver: bridge

volumes:
  notesapp_data:
